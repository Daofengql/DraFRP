# Optional drop-in for drafrp-edge.service on a dedicated edge interface.
# Install as /etc/systemd/system/drafrp-edge.service.d/wire.conf, install
# iproute2/tc, and use edge-wire.json as /etc/drafrp/edge.json.
# Never enable this on a shared management interface. The qdisc caps ALL
# egress on the named interface, including SSH and control traffic.
[Service]
AmbientCapabilities=CAP_NET_BIND_SERVICE CAP_NET_ADMIN
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_NET_ADMIN
StateDirectory=drafrp-edge
StateDirectoryMode=0700
